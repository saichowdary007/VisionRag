version: "3.8"
services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd:/etcd
    command: etcd -advertise-client-urls=http://0.0.0.0:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
    platform: linux/arm64

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    command: minio server /minio_data --console-address ':9001'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - minio:/minio_data
    platform: linux/arm64

  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.3.12
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    volumes:
      - milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    platform: linux/arm64

  retriever:
    build:
      context: ../
      dockerfile: ./deployment/retriever.Dockerfile
    environment:
      - MODEL_ID=${MODEL_ID}
      - MILVUS_URI=http://milvus:19530
      - COLLECTION_NAME=${COLLECTION_NAME:-colpali_multivector_collection}
      - DEVICE=cpu
      - TOP_K=${TOP_K:-5}
      - DATA_DIR=/data
    depends_on:
      milvus:
        condition: service_healthy
    platform: linux/arm64
    ports:
      - "8081:8081"

  api:
    build:
      context: ../
      dockerfile: ./deployment/api.Dockerfile
    environment:
      - RETRIEVER_URL=http://retriever:8081
      - VLM_BASE_URL=${VLM_BASE_URL}
      - VLM_MODEL=${VLM_MODEL}
      - TOP_K=${TOP_K:-5}
      - MAX_IMAGES=${MAX_IMAGES:-3}
    depends_on:
      - retriever
    platform: linux/arm64
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../
      dockerfile: ./deployment/frontend.Dockerfile
    environment:
      - BACKEND_API_URL=http://api:8080
      - RETRIEVER_URL=http://retriever:8081
    depends_on:
      - api
    platform: linux/arm64
    ports:
      - "3000:3000"

volumes:
  etcd:
  minio:
  milvus:

