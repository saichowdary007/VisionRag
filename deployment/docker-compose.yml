services:
  # Milvus Vector Database
  milvus:
    image: milvusdb/milvus:v2.4.4
    platform: linux/amd64
    ports:
      - "19530:19530"
    volumes:
      - ../milvus_data:/milvus/data
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
    depends_on:
      - etcd
      - minio
    command: ["milvus", "run", "standalone"]

  # Etcd for Milvus metadata
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  # MinIO for Milvus object storage
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio_data:/data
    command: minio server /data --console-address ":9001"

  # RAG Vision API Service
  api_service:
    build:
      context: ../
      dockerfile: ./deployment/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - RETRIEVER_MODEL_ID=vidore/colpali-v1.3
      - MILVUS_URI=http://milvus:19530
      - COLLECTION_NAME=rag_vision_collection
      - QA_API_BASE=http://host.docker.internal:11434
      - QA_API_KEY=EMPTY
      - QA_MODEL_ID=qwen3:4b-instruct-2507-q4_K_M
      - TOP_K_CANDIDATES=50
      - TOP_K_FINAL=3
      - USE_MILVUS=true
      - VLM_BASE_URL=http://host.docker.internal:11434
      - VLM_MODEL=qwen3:4b-instruct-2507-q4_K_M
      - INDEX_ON_INGEST=false
      # Apple Silicon Configuration (CPU mode in Docker)
      # Note: MPS only works when running natively on macOS, not in Linux containers
      # For MPS acceleration, run the application natively: python services/api_service.py
      - DEVICE=cpu  # Use CPU in Docker container (MPS not available in Linux containers)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../pages:/app/pages
    # Apple Silicon MPS Device Access (M1 Pro/Max/Ultra)
    # Note: MPS (Metal Performance Shaders) works automatically on Apple Silicon
    # No explicit device mapping needed - Docker will use host MPS automatically
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: mps  # For Apple Silicon (automatically handled)

  # Ingestion Service (run once)
  ingestion_service:
    build:
      context: ../
      dockerfile: ./deployment/Dockerfile.ingestion
    environment:
      - RETRIEVER_MODEL_ID=vidore/colpali-v1.3
      - MILVUS_URI=http://milvus:19530
      - COLLECTION_NAME=rag_vision_collection
      - SOURCE_DOCS_DIR=/app/documents
      - PAGE_IMAGE_DIR=/app/pages
    depends_on:
      - milvus
    volumes:
      - ../documents:/app/documents
      - ../pages:/app/pages
    profiles:
      - ingestion  # Only run when explicitly requested

  # Frontend (unchanged)
  frontend:
    build:
      context: ../
      dockerfile: ./deployment/frontend.Dockerfile
    environment:
      - BACKEND_API_URL=http://api_service:8000
      - INGEST_TIMEOUT_MS=300000
      - RETRIEVER_TIMEOUT_MS=300000
      - QUERY_TIMEOUT_MS=180000
    depends_on:
      - api_service
    platform: linux/arm64
    ports:
      - "3000:3000"

volumes:
  etcd_data:
  minio_data:
