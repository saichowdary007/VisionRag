version: '3.8'

services:
  api_service:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.api
    container_name: vlm_rag_api
    ports:
      - "8000:8000"
    environment:
      - MILVUS_URI=/app/storage/milvus.db
      - COLLECTION_NAME=rag_vision_collection
      - QA_API_BASE=http://host.docker.internal:11434/v1
      - QA_API_KEY=ollama
      - QA_MODEL_ID=qwen2.5-vl:7b
      - RETRIEVER_MODEL_ID=vidore/colpali-v1.3
      - TOP_K_CANDIDATES=50
      - TOP_K_FINAL=3
      - IMAGE_DPI=200
    volumes:
      - ../storage:/app/storage
      - ../documents:/app/documents
      - ../pages:/app/pages
      - ../index.html:/app/index.html
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ingestion_service:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.ingestion
    container_name: vlm_rag_ingestion
    profiles:
      - ingestion
    environment:
      - MILVUS_URI=/app/storage/milvus.db
      - COLLECTION_NAME=rag_vision_collection
      - RETRIEVER_MODEL_ID=vidore/colpali-v1.3
      - IMAGE_DPI=200
    volumes:
      - ../storage:/app/storage
      - ../documents:/app/documents
      - ../pages:/app/pages
