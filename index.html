<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>RAG Vision Chat</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #121821;
      --muted: #7c8aa5;
      --text: #e8eefc;
      --accent: #6aa1ff;
      --accent-2: #8a7dff;
      --success: #35c48f;
      --danger: #ff6a6a;
      --chip: #1b2432;
      --border: #1a2330;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji"; background: radial-gradient(1200px 800px at 70% -10%, #1f2a40 0%, rgba(15,18,24,0) 50%), var(--bg); color: var(--text); }
    .container { display: grid; grid-template-columns: 360px 1fr; height: 100vh; }
    .sidebar { border-right: 1px solid var(--border); background: linear-gradient(180deg, rgba(32,40,56,0.4), rgba(18,24,33,0.8)); padding: 20px; overflow: auto; }
    .logo { display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:0.2px; }
    .logo .dot { width:10px; height:10px; border-radius:50%; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow:0 0 14px rgba(106,161,255,0.7); }
    h1 { font-size: 18px; margin: 0; }
    .uploader { margin-top: 16px; padding: 16px; border: 1px dashed #2a384f; border-radius: 12px; background: #0f1520; text-align: center; transition: border .2s, background .2s; }
    .uploader.drag { border-color: var(--accent); background: #101a2a; }
    .uploader input { display: none; }
    .uploader .btn { margin-top: 10px; display: inline-block; padding: 10px 14px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; text-decoration: none; font-weight: 600; box-shadow: 0 6px 26px rgba(106,161,255,0.25); }
    .status { margin-top: 10px; color: var(--muted); font-size: 13px; }
    .files { margin-top: 16px; display: grid; gap: 10px; }
    .file { padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: #0c121b; display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .file .name { color: #cfe0ff; font-size: 14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:220px; }
    .file .ok { color: var(--success); font-size: 12px; }

    .main { display:flex; flex-direction:column; height:100%; }
    .chat { flex:1; display:flex; flex-direction:column; padding: 20px; overflow:auto; }
    .messages { flex:1; display:flex; flex-direction:column; gap:12px; overflow:auto; padding-right:8px; }
    .msg { max-width: 70%; padding: 12px 14px; border-radius: 12px; line-height:1.4; box-shadow: 0 8px 22px rgba(0,0,0,0.18); }
    .user { background: linear-gradient(135deg, #203250, #152033); align-self: flex-end; border:1px solid #2a3b55; }
    .bot { background: #0e1622; border:1px solid #1a2535; }
    .sources { margin-top: 8px; display:flex; gap:8px; flex-wrap:wrap; }
    .thumb { width: 120px; height: 160px; object-fit: cover; border-radius: 8px; border:1px solid #1a2230; background:#0c121b; }

    .composer { padding: 16px 20px; border-top:1px solid var(--border); display:flex; gap: 10px; background: linear-gradient(180deg, rgba(15,18,24,0.6), rgba(15,18,24,0.9)); }
    .input { flex:1; background: #0c121b; border:1px solid #1a2330; color: var(--text); padding: 12px 14px; border-radius: 12px; outline:none; }
    .send { padding: 12px 16px; border-radius: 12px; border: none; font-weight:700; color:#0b0f14; background: linear-gradient(135deg, var(--accent), var(--accent-2)); cursor: pointer; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
    @media (max-width: 980px){ .container{ grid-template-columns:1fr; } .sidebar{ height:auto; } }
  </style>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <div class="logo"><span class="dot"></span><h1>RAG Vision</h1></div>
      <div class="uploader" id="drop">
        <p><strong>Upload PDFs</strong> — drag & drop here</p>
        <label class="btn" for="file">Choose Files</label>
        <input id="file" type="file" accept="application/pdf" multiple />
        <div class="status" id="uploadStatus">No files uploaded yet.</div>
      </div>
      <div class="files" id="files"></div>
      <div class="hint">Files are ingested locally and indexed for visual retrieval. After uploading, start chatting on the right.</div>
    </aside>
    <main class="main">
      <div class="chat">
        <div class="messages" id="messages"></div>
      </div>
      <div class="composer">
        <input class="input" id="query" placeholder="Ask something about your documents…" />
        <button class="send" id="send">Send</button>
      </div>
    </main>
  </div>

  <script>
    const drop = document.getElementById('drop');
    const fileInput = document.getElementById('file');
    const filesList = document.getElementById('files');
    const statusEl = document.getElementById('uploadStatus');
    const messages = document.getElementById('messages');
    const queryEl = document.getElementById('query');
    const sendBtn = document.getElementById('send');

    const apiBase = window.location.origin; // Use same origin for security

    // Basic input sanitization
    function sanitizeInput(text) {
      return text.replace(/[<>]/g, '').trim();
    }

    function addMsg(text, role='bot', sources=[]) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.innerHTML = text.replace(/\n/g,'<br/>');
      if (sources && sources.length) {
        const s = document.createElement('div');
        s.className = 'sources';
        sources.forEach(src => {
          if (src.source_url) {
            const img = document.createElement('img');
            img.className = 'thumb';
            img.src = src.source_url;
            img.title = `${src.page} (score: ${src.score?.toFixed?.(2) ?? src.score})`;
            s.appendChild(img);
          }
        });
        div.appendChild(s);
      }
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function addFile(name, ok=true) {
      const row = document.createElement('div');
      row.className = 'file';
      row.innerHTML = `<span class="name" title="${name}">📄 ${name}</span><span class="ok">${ok? 'Indexed' : 'Pending'}</span>`;
      filesList.prepend(row);
    }

    // Drag & drop behavior
    ;['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.add('drag'); }));
    ;['dragleave','drop'].forEach(ev=>drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.remove('drag'); }));
    drop.addEventListener('drop', e=>{
      const dt = e.dataTransfer; if (!dt) return; uploadFiles(dt.files);
    });
    fileInput.addEventListener('change', ()=> uploadFiles(fileInput.files));

    async function uploadFiles(fileList){
      if (!fileList || !fileList.length) return;
      statusEl.textContent = 'Uploading & indexing…';
      for (const f of fileList){
        const form = new FormData();
        form.append('file', f);
        try {
          const res = await fetch(`${apiBase}/upload`, { method: 'POST', body: form });
          if (!res.ok) throw new Error(await res.text());
          const data = await res.json();
          addFile(data.filename || f.name, true);
        } catch(err){
          console.error(err);
          addFile(f.name, false);
        }
      }
      statusEl.textContent = 'Upload complete.';
    }

    sendBtn.addEventListener('click', ask);
    queryEl.addEventListener('keydown', (e)=>{ if(e.key==='Enter') ask(); });

    async function ask(){
      const rawQuery = queryEl.value.trim();
      if(!rawQuery) return;

      const q = sanitizeInput(rawQuery);
      if(!q) {
        addMsg('⚠️ Invalid input. Please enter a valid question.', 'bot');
        return;
      }

      queryEl.value = '';
      addMsg(q, 'user');
      addMsg('Thinking…');

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 60000); // 60 second timeout

        const res = await fetch(`${apiBase}/ask`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Requested-With': 'XMLHttpRequest' // CSRF protection
          },
          body: JSON.stringify({ query: q }),
          signal: controller.signal
        });

        clearTimeout(timeoutId);

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}: ${res.statusText}`);
        }

        const data = await res.json();
        messages.removeChild(messages.lastChild); // remove 'Thinking…'

        if (data.error){
          addMsg('⚠️ ' + data.error, 'bot');
          return;
        }

        addMsg(data.answer || '(no answer)', 'bot', data.sources || []);
      } catch (e){
        messages.removeChild(messages.lastChild);
        if (e.name === 'AbortError') {
          addMsg('⚠️ Request timed out. Please try again.', 'bot');
        } else {
          console.error('Request failed:', e);
          addMsg('⚠️ Request failed. Please check your connection and try again.', 'bot');
        }
      }
    }
  </script>
</body>
</html>
