services:
  # vlm:
  #   image: lmstudio/desktop:latest
  #   command: ["--headless", "--port", "1234"]
  #   ports: ["1234:1234"]
  #   volumes:
  #     - models:/models
  #   environment:
  #     - LMSTUDIO_DOWNLOAD_PATH=/models
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:1234/v1/models"]
  #     interval: 10s
  #     retries: 10

  retriever:
    build: .
    ports: ["8081:8081"]
    volumes:
      - data:/data
    environment:
      - SERVICE=retriever
      # Prefer DATA_DIR; keep BYALDI_DATA for backwards-compat inside app
      - DATA_DIR=/data
      - BYALDI_DATA=/data
      # Force lightweight fallback index unless you want full ColPali
      - BYALDI_USE_FALLBACK=1

  api:
    build: .
    ports: ["8080:8080"]
    depends_on:
      - retriever
      # - vlm
    volumes:
      - data:/data
    environment:
      - SERVICE=api
      - DATA_DIR=/data
      - RETRIEVER_BASE_URL=http://retriever:8081
      # - LMSTUDIO_BASE_URL=http://vlm:1234
      # - LMSTUDIO_MODEL=google/gemma-3-12b-it
      - API_INTERNAL_BASE=http://api:8080
      - API_PUBLIC_BASE=http://localhost:8080
      - WEB_ORIGIN=http://localhost:5173

  web:
    build: ./web
    ports: ["5173:80"]
    environment:
      # The app defaults to http://localhost:8080 if unset.
      # This env var is only used at build time by Vite.
      - VITE_API_BASE=http://localhost:8080

volumes:
  data: {}
  models: {}
