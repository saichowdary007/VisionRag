services:
  retriever:
    build: .
    # platform: "linux/arm64"  # uncomment on Apple Silicon if needed
    ports: ["8081:8081"]
    volumes:
      - data:/data
    environment:
      - SERVICE=retriever
      - DATA_DIR=${DATA_DIR:-/data}
      - RETRIEVER_MODEL=${RETRIEVER_MODEL:-vidore/colpali-v1.2}
      - RETRIEVER_INDEX_DIR=${RETRIEVER_INDEX_DIR:-/data/index}
      - RETRIEVER_DEVICE=${RETRIEVER_DEVICE:-cpu}
      # Enable fallback only when needed; default to Byaldi
      # - BYALDI_USE_FALLBACK=1
      # Hybrid weight (0 disables BM25)
      - HYBRID_ALPHA=${HYBRID_ALPHA:-0.2}
      # Reranking configuration
      - RERANK_ENABLED=${RERANK_ENABLED:-1}
      - RERANK_MODEL=${RERANK_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      - RERANK_DEVICE=${RERANK_DEVICE:-cuda}
      - RERANK_WEIGHT=${RERANK_WEIGHT:-0.2}
      # Async indexing
      - INDEX_ASYNC=${INDEX_ASYNC:-1}

  api:
    build: .
    # platform: "linux/arm64"  # uncomment on Apple Silicon if needed
    ports: ["8080:8080"]
    depends_on:
      - retriever
    volumes:
      - data:/data
    environment:
      - SERVICE=api
      - DATA_DIR=${DATA_DIR:-/data}
      - RETRIEVER_BASE_URL=${RETRIEVER_BASE_URL:-http://retriever:8081}
      # VLM (OpenAI-compatible). Using host LM Studio
      - VLM_BASE_URL=${VLM_BASE_URL:-http://host.docker.internal:1234}
      - VLM_MODEL=${VLM_MODEL:-gemma-3-4b-it}
      - VLM_API_KEY=${VLM_API_KEY:-lm-studio}
      # Internal URLs for VLM to fetch images (host LM Studio)
      - API_INTERNAL_BASE=${API_INTERNAL_BASE:-http://host.docker.internal:8080}
      - API_PUBLIC_BASE=${API_PUBLIC_BASE:-http://localhost:8080}
      - WEB_ORIGIN=${WEB_ORIGIN:-http://localhost:5173}

  web:
    build: ./web
    # platform: "linux/arm64"  # uncomment on Apple Silicon if needed
    ports: ["5173:80"]
    environment:
      # The app defaults to http://localhost:8080 if unset.
      # This env var is only used at build time by Vite.
      - VITE_API_BASE=${API_PUBLIC_BASE:-http://localhost:8080}

volumes:
  data: {}
